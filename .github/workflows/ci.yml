name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the SOURCE_ABSENT manifest guard reads legacy blobs from origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # RESP-GATE-COUNT-DERIVATION-001: the gate counts are DERIVED from the runner, so a
      # hand-copied count fails the build here instead of drifting into four documents. This
      # runs the suite itself, so it also fails if anything is red.
      - run: npm run gate:check
      - run: npm test
