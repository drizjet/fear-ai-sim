name: Fear-AI CI

# Hard Rule 9 (owner mandate 2026-09-14, executed 2026-09-15): all 465 automated
# test suites were permanently retired — 465 suites / 67,524 lines deleted at
# tag `v-test-retirement-complete` — and verification in this repository is
# 100% manual. This workflow runs the two things that survive the retirement,
# matching `docs/SYSTEM_MAP.md` ("CI Gate Split NOW-9"), which is the authority
# for what CI does:
#
#   repository-integrity (ubuntu, Node builtins only, no install)
#     1. the Hard Rule 9 advisory compliance check, which asserts the retirement
#        is intact and that CI itself has not grown a step that cannot pass
#        (`npm run verify:hard-rule-9`)
#     2. the authority guardian baseline (`npm run guardian:check`)
#
#   probes (windows, with install)
#     3. the deterministic probe suite (`npm run verify:probes`) — the manual
#        regime's real gate, run in one place instead of twenty-five terminals.
#        These are standalone probes, not suites. Windows deliberately: the
#        probes' external halves resolve Windows tool paths (the Godot binary,
#        the Unity Editor install) and every recorded evidence artifact in
#        evidence/ was captured on Windows/Node. On a Linux runner those halves
#        would all report SKIPPED, so the job would look the same while proving
#        less. The runner reports each probe's own SKIPPED lines as NOT PROVEN
#        rather than counting them as passes, and FEAR_AI_EXPECT_PROVEN turns a
#        skip in one of the three in-engine probes into a failure — because this
#        job fetches the pinned Godot 4.6 binary (tools/ci/fetch_godot.ps1), so an
#        in-engine skip here means the environment lost something, not that the
#        claim was never checkable.
#
#   probe-stability (windows, with install) — nightly and on demand only
#     4. the same probe suite run repeatedly (`npm run verify:probe-stability`),
#        which fails on a probe whose verdicts disagree. The `probes` job above
#        proves each claim once; only repetition shows the proof is
#        deterministic. That distinction matters more than it sounds: an
#        intermittent probe teaches its reader to re-run until green, and a
#        re-run-until-green suite is indistinguishable from a suite that proves
#        nothing. Nightly rather than per-push because a flake is by definition
#        invisible to the run that did not hit it, and because tripling the probe
#        suite on every pull request would buy latency instead of signal.
#
#     4b. and on the scheduled run only, the night itself is proposed as a
#        REVIEWED change: `tools/ci/open_ledger_night_pr.ps1 -Execute` folds it
#        onto the branch `ci/stability-ledger` and opens (or updates) the pull
#        request a human merges. The ledger is the denominator of every rate this
#        repository reports and the release dossier quotes its numbers, so a night
#        entering the record is a change someone should look at — but a record that
#        only grows when a human remembers to download an artifact bounds nothing:
#        one night bounds a probe's flake rate at 79%, five nights at 43%. A CI job
#        cannot commit to the default branch, and this one does not: it pushes a
#        branch and a diff, and a human decides. Two things about the step are
#        load-bearing and are asserted by the integrity check rather than trusted:
#        it passes -Execute (without it the step would dry-run and report success
#        while pushing nothing), and it is gated to `schedule` on the default
#        branch. The second is not decoration: the script dispatches this same
#        workflow on the branch it just pushed, because a GITHUB_TOKEN push does not
#        trigger workflows and the pull request would otherwise show no checks at
#        all. A dispatched run on the review branch therefore re-enters this job,
#        and if it could also fold, every night would fold an unbounded chain of
#        nights. Gating on `schedule` is what makes that impossible, and the job
#        needs `contents: write`, `pull-requests: write` and `actions: write` to do
#        any of it.
#
#   unity-editmode (inert until a runner has an Editor)
#     5. the Unity adapter's EditMode tests in a REAL Unity Editor
#        (`npm run verify:unity-editor`). This is the one probe in the suite that
#        self-skips everywhere this repository has run so far, and the job below
#        cannot fix that by itself: a GitHub-hosted runner has no Unity Editor and
#        no license, so a job that installed one would either need a license
#        secret this repository does not have or fail forever. A permanently red
#        job is the exact failure this workflow was rewritten to remove, so the
#        job is instead **inert until a runner is configured for it**: it runs
#        only when the repository variable `UNITY_EDITOR_AVAILABLE` is `true`,
#        points at an Editor through `UNITY_EDITOR`, and sets
#        `FEAR_AI_UNITY_REQUIRED=1` so that, once it does run, a missing Editor is
#        a failure rather than a comfortable skip. Until then it is excluded by
#        its own `if:` and proves nothing — which the ledger and the release
#        dossier both say, rather than leaving the row looking verified.
#
# Deliberately removed, and not to be re-added as blocking gates:
#   - the Jest matrix and the Codecov coverage upload: the runner, the
#     `test:coverage` script and the coverage dependencies no longer exist, so
#     those steps could never pass. A permanently red gate is worse than no
#     gate, because it teaches everyone that red means nothing.
#   - `npm test` as a step: it is a tombstone that exits non-zero (code 9) on
#     purpose. Running it here would be red by design.
#   - the evidence ledger gate (`npm run lint:evidence`): the ledger is a closed
#     record as of 2026-09-06 and the linter exits 1 against its own declared
#     maturity, so a blocking gate there could never pass either. See
#     `docs/DOMAIN_MATURITY.md` for what replaced it as an authority.
#
# The `run:` commands below are asserted against an allowlist in
# tools/guardian/hard-rule-9.mjs, so adding a step that cannot pass fails the
# integrity job instead of quietly turning CI red again.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 04:00 UTC daily. See the probe-stability job below for why determinism is
    # checked on a clock rather than on every push.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  repository-integrity:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Hard Rule 9 advisory compliance check
      run: npm run verify:hard-rule-9
      working-directory: fear-ai-sim

    - name: Authority guardian baseline (must report CLEAN)
      run: npm run guardian:check
      working-directory: fear-ai-sim

  probes:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: fear-ai-sim/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: fear-ai-sim

    # The cross-language signing probe runs the real Python adapter, and building
    # an RSA key needs `cryptography`. The runner image ships python but NOT that
    # wheel, which the first real CI run found the hard way: five checks failed
    # reading as "the Python adapter is broken" while the cause was a missing
    # package, and the adapter's own diagnosis was in a variable nobody printed.
    # Pinned for the same reason the engine below is — an unpinned install would
    # make the recorded evidence depend on whatever PyPI served that day.
    - name: Install the Python signing backend (pinned)
      run: python -m pip install --no-input cryptography==50.0.1

    # The three probes with in-engine halves need a real engine or they report
    # SKIPPED. Fetching the same pinned version the recorded evidence used is what
    # makes this job prove something in-engine rather than only in Node.
    - name: Fetch the pinned Godot 4.6 binary and warm the import cache
      run: pwsh -File tools/ci/fetch_godot.ps1
      working-directory: fear-ai-sim

    # FEAR_AI_EXPECT_PROVEN declares that this runner HAS the runtimes those
    # probes need, so a SKIPPED line there is an environment defect rather than an
    # honest limitation, and the runner fails instead of reporting green.
    # (`transport_signing` also needs `python`, which the runner image provides.)
    - name: Run the deterministic probe suite
      env:
        FEAR_AI_EXPECT_PROVEN: store_encryption,host_token_persistence,transport_signing
      run: npm run verify:probes -- --json probe_suite_report.json
      working-directory: fear-ai-sim

    - name: Upload the probe summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: probe-suite-report
        path: fear-ai-sim/probe_suite_report.json
        if-no-files-found: warn

  # Nightly, and on demand from the Actions tab. Everything below is identical to
  # the `probes` job except for the last step: each probe is run three times and a
  # probe whose verdicts disagree is called FLAKY and counted as a failure.
  probe-stability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # Pushing the review branch and opening its pull request needs a token that may do
    # both; dispatching CI on that branch needs `actions: write`. These are declared here
    # rather than repo-wide so that no other job gains a write scope it does not use.
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: fear-ai-sim/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: fear-ai-sim

    # Same pinned Python backend as the probe job above, for the same reason: the
    # stability run declares the same runtimes, so it must have them too.
    - name: Install the Python signing backend (pinned)
      run: python -m pip install --no-input cryptography==50.0.1

    # Same engine, same reason: three of the probes have in-engine halves that
    # would otherwise report SKIPPED here, and a claim that is skipped on the
    # runner that is supposed to prove it is not proven at all.
    - name: Fetch the pinned Godot 4.6 binary and warm the import cache
      run: pwsh -File tools/ci/fetch_godot.ps1
      working-directory: fear-ai-sim

    - name: Run the probe suite repeatedly
      env:
        FEAR_AI_EXPECT_PROVEN: store_encryption,host_token_persistence,transport_signing
      run: npm run verify:probe-stability -- --json probe_stability_report.json
      working-directory: fear-ai-sim

    # The fresh run is compared against the committed recording, and appended to the
    # rolling ledger. `if: always()` because this is most useful in the run that
    # went red: it names which probe changed, what it used to say, and whether the
    # ledger has seen this probe disagree with itself before.
    - name: Compare against the committed recording and extend the ledger
      if: always()
      run: npm run verify:stability-regression -- --append-history evidence/probe_stability_ledger.jsonl --json probe_stability_comparison.json
      working-directory: fear-ai-sim

    # The night becomes a reviewed change. Scheduled runs only: a `workflow_dispatch` on
    # the review branch must never fold (see 4b in the header), and the script itself
    # refuses to build on a commit this run did not start from.
    - name: Propose tonight's night as a reviewed pull request
      if: github.event_name == 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: pwsh -File tools/ci/open_ledger_night_pr.ps1 -Execute
      working-directory: fear-ai-sim

    # `if: always()` so a flaky run still uploads the reports that name the
    # verdicts it saw — the evidence of a flake is the sequence, not the failure.
    # The ledger uploaded here is the one the step above folded, so it is the
    # committed ledger plus tonight's entry plus any night still waiting on the review
    # branch — the same content the pull request carries, not a second opinion on it.
    #
    # The fresh report writes at the repository root on purpose, and that path is
    # not the one the dossier reads: `evidence/probe_stability_report.json` is a
    # recording made by hand and committed beside the run it describes, while this
    # artifact is whatever this runner saw tonight.
    - name: Upload the stability report, ledger and comparison
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: probe-stability-report
        path: |
          fear-ai-sim/probe_stability_report.json
          fear-ai-sim/probe_stability_comparison.json
          fear-ai-sim/evidence/probe_stability_ledger.jsonl
        if-no-files-found: warn

  # The Unity adapter's EditMode tests, in a real Editor. Inert by design: see the
  # header note. `vm.UNITY_EDITOR_AVAILABLE` is set by whoever provisions the
  # runner, and `UNITY_EDITOR` is the path that runner's Editor lives at (the
  # probe also discovers Hub install roots on its own, so it can be left unset).
  unity-editmode:
    if: vars.UNITY_EDITOR_AVAILABLE == 'true'
    runs-on: ${{ vars.UNITY_RUNNER || 'windows-latest' }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: fear-ai-sim/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: fear-ai-sim

    # FEAR_AI_UNITY_REQUIRED=1 is the whole point of running this job at all: on a
    # runner that HAS an Editor, a SKIPPED line is a configuration defect, and the
    # probe exits non-zero for it. The probe assembles its own throwaway Unity
    # project from packages/adapters/unity, so no scene or project file is needed
    # here — it runs `-batchmode -runTests -testPlatform EditMode` and fails on a
    # red test, a missing results file, or zero tests executed.
    - name: Run the Unity adapter EditMode tests in a real Editor
      env:
        FEAR_AI_UNITY: ${{ vars.UNITY_EDITOR }}
        FEAR_AI_UNITY_REQUIRED: '1'
      run: npm run verify:unity-editor
      working-directory: fear-ai-sim
