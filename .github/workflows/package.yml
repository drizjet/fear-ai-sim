name: Adapter Packaging

# Release-integrity workflow, not a verification workflow.
#
# Hard Rule 9 retired every automated test suite. This workflow does not run a
# suite and does not replace a probe. It builds the production bundle and the
# six adapter packages from git-tracked files only, then verifies the package
# contents, LICENSE, manifests and checksums. The manual verification regime
# remains `test.yml` and the standalone probes.
#
# The `run:` commands are in the Hard Rule 9 allowlist, and
# docs/SYSTEM_MAP.md states the same contract. The pull request trigger is bare
# so every PR gets a run; the push trigger stays on the default branches.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
      with:
        # On pull_request, actions/checkout defaults to the synthetic merge
        # commit. Package the real PR head so PACKAGE_MANIFEST.json records a
        # commit that exists on the branch, not a temporary merge ref.
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Use Node.js 24.x
      uses: actions/setup-node@v5
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: fear-ai-sim/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: fear-ai-sim

    - name: Build the production bundle
      run: npm run build
      working-directory: fear-ai-sim

    - name: Package adapters from tracked files only
      run: npm run pack:adapters
      working-directory: fear-ai-sim

    - name: Verify package contents, licenses and checksums
      run: npm run verify:adapters-package
      working-directory: fear-ai-sim

    - name: Upload the verified release packages
      uses: actions/upload-artifact@v6
      with:
        name: fear-ai-adapter-packages
        path: |
          fear-ai-sim/packages/dist/*.zip
          fear-ai-sim/packages/dist/CHECKSUMS.sha256
          fear-ai-sim/packages/dist/RELEASE_MANIFEST.json
        if-no-files-found: error
