<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0a0b0e" />
  
  <!-- Red Fighter (Dot) -->
  <circle cx="180" cy="256" r="40" fill="#ff0055" filter="url(#glow)" />
  <!-- Sword (Floating) -->
  <path d="M 230 220 L 280 170 L 290 180 L 240 230 Z" fill="#e0e6ed" filter="url(#glow)" />
  <rect x="225" y="225" width="20" height="5" transform="rotate(-45 225 225)" fill="#444" />
  
  <!-- Blue Fighter (Dot) -->
  <circle cx="332" cy="256" r="40" fill="#00f2ff" filter="url(#glow)" />
  <!-- Great Hammer (Floating) -->
  <rect x="360" y="180" width="60" height="40" rx="4" fill="#e0e6ed" filter="url(#glow)" />
  <rect x="385" y="220" width="10" height="80" fill="#444" />
  
  <!-- "NANO" Text Accent -->
  <text x="256" y="450" font-family="JetBrains Mono, monospace" font-size="40" fill="#94a3b8" text-anchor="middle" letter-spacing="10">NANOLANE</text>
</svg>
